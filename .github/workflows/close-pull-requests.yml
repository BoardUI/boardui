name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close with an explanation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR" --comment "Thanks for taking the time. This repository is generated from BoardUI's source and the next export overwrites it, so pull requests cannot be merged here. Please email hi@boardui.com about the change and it will be made at the source. See CONTRIBUTING.md."
